server:
  port: 8080

spring:
  application:
    name: "back-arka-core"

  datasource:
    url: jdbc:mysql://database-arka.c6p2yc4yy1z6.us-east-1.rds.amazonaws.com:3306/arkadatabase
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      autoCommit: true
      connectionTimeout: 30000
      idleTimeout: 600000
      keepaliveTime: 120000
      maxLifetime: 1800000
      maximumPoolSize: 50
      minimumIdle: 8
      poolName: PoolConnection-ArkaProyect
      leakDetectionThreshold: 30000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

aws:
  dynamodb:
    region: us-east-1
    table:
      client: clientes

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always



