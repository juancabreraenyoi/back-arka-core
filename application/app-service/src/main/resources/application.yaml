spring:
  application:
    name: "back-arka-core"
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always


datasource:
  url: jdbc:h2:mem:testdb
  username: sa
  password:
  driver-class-name: com.h2.Driver
h2:
  console:
    enabled: true
    path: /h2-console

jpa:
  database-platform: org.hibernate.dialect.H2Dialect
  hibernate:
    ddl-auto: validate
  show-sql: true
  properties:
    hibernate:
      formate_sql: true
      use_sql_comments: true
sql:
  init:
    mode: always
    schema-locations: classpath:schema.sql
    data-locations: classpath:data.sql
    platform: h2

