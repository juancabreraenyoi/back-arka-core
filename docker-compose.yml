
services:
  back-arka-core:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      target: production
    container_name: back-arka-core
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD","wget","--quiet","--tries=1","--spider","http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - arka-network
networks:
  arka-network:
    driver: bridge